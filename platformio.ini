; One SkyTracker codebase, explicit per-hardware firmware images.
; Do NOT combine incompatible panel/MCU variants into one generic flash image.
; All listed profiles are compile targets, NOT hardware-verified releases.
[env]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
; Exclude standalone diagnostic source from normal application builds.
build_src_filter = +<*> -<diag/>
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TJpg_Decoder @ ^1.1.0
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_READ_FREQUENCY=1000000
    -D SPI_TOUCH_FREQUENCY=2500000

; Original 2.8" CYD, resistive touch, single USB / ILI9341.
[env:cyd_2432s028r]
build_flags =
    ${env.build_flags}
    -D SKYTRACKER_BOARD_ID=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D SPI_FREQUENCY=40000000

; ILI9341-based 2.8" v2; some units require different panel init.
[env:cyd_2432s028r_v2]
build_flags =
    ${env.build_flags}
    -D SKYTRACKER_BOARD_ID=2
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D USE_HSPI_PORT
    -D TFT_INVERSION_ON
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD

; ST7789-based 2.8" CYD2USB / v3 (do NOT assume all two-port panels use ST7789).
[env:cyd_2432s028r_st7789]
build_flags =
    ${env.build_flags}
    -D SKYTRACKER_BOARD_ID=3
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D SPI_FREQUENCY=40000000
    -D TFT_INVERSION_ON

; 2.4" Sunton resistive ILI9341.
[env:cyd_2432s024r]
build_flags =
    ${env.build_flags}
    -D SKYTRACKER_BOARD_ID=4
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=27
    -D SPI_FREQUENCY=40000000

; 3.5" Sunton resistive ST7796.
[env:cyd_3248s035r]
build_flags =
    ${env.build_flags}
    -D SKYTRACKER_BOARD_ID=5
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_BL=27
    -D SPI_FREQUENCY=40000000

; Isolated display diagnostics for the user's 2-USB 2.8" ESP32-2432S028.
; These compile ONLY the diagnostic; no touch/SD/Wi-Fi code or shared app.
; Tested GPIO wiring from CYD2USB references. Physical success unverified.
[env:diag_cyd2usb_st7789]
build_src_filter =
    -<*>
    +<diag/display_only.cpp>
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D USE_HSPI_PORT
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD

[env:diag_cyd2usb_ili9341]
build_src_filter =
    -<*>
    +<diag/display_only.cpp>
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D USE_HSPI_PORT
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD

[env:diag_cyd2usb_ili9341_inverted]
build_src_filter =
    -<*>
    +<diag/display_only.cpp>
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D USE_HSPI_PORT
    -D TFT_INVERSION_ON
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD
