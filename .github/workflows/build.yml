name: Compile CYD firmware variants

on:
  push:
    branches: [main, 'development/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - cyd_2432s028r
          - cyd_2432s028r_v2
          - cyd_2432s028r_st7789
          - cyd_2432s024r
          - cyd_3248s035r
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO and image tools
        run: python -m pip install --upgrade platformio pillow
      - name: Test map pack conversion
        if: matrix.target == 'cyd_2432s028r'
        run: python -m unittest discover -s tests -v
      - name: Compile profile
        run: pio run -e ${{ matrix.target }}
      - name: Enforce OTA partition size limit
        shell: bash
        run: |
          FILE=".pio/build/${{ matrix.target }}/firmware.bin"
          BYTES=$(stat -c%s "$FILE")
          echo "Board: ${{ matrix.target }}, Firmware size: $BYTES bytes"
          test "$BYTES" -le 1966080
      - name: Save development firmware (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: skytracker-dev-${{ matrix.target }}
          path: |
            .pio/build/${{ matrix.target }}/firmware.bin
            .pio/build/${{ matrix.target }}/bootloader.bin
            .pio/build/${{ matrix.target }}/partitions.bin
          if-no-files-found: error
