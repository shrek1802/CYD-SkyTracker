name: Compile CYD firmware

on:
  push:
    branches: [main, 'development/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile
        run: pio run -e cyd_2432s028r
      - name: Enforce OTA partition size limit
        shell: bash
        run: |
          FILE=.pio/build/cyd_2432s028r/firmware.bin
          BYTES=$(stat -c%s "$FILE")
          echo "Firmware size: $BYTES bytes"
          test "$BYTES" -le 1966080
      - name: Save development firmware (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: skytracker-dev-firmware
          path: |
            .pio/build/cyd_2432s028r/firmware.bin
            .pio/build/cyd_2432s028r/bootloader.bin
            .pio/build/cyd_2432s028r/partitions.bin
          if-no-files-found: error
