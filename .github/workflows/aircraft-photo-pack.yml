name: Build openly licensed aircraft type photo SD pack

on:
  pull_request:
    paths:
      - tools/build_aircraft_photo_pack.py
      - .github/workflows/aircraft-photo-pack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create_sd_pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Build photos with attribution from Wikimedia Commons
        run: |
          python tools/build_aircraft_photo_pack.py --output /tmp/SkyTracker-Photo-SD
      - name: Validate image package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image
          p=Path('/tmp/SkyTracker-Photo-SD/SkyTracker-Representative-Plane-Photos-SD.zip')
          with ZipFile(p) as z:
            assert z.testzip() is None
            images=[n for n in z.namelist() if n.endswith('.jpg')]
            assert len(images)>=4
            for name in images:
              data=z.read(name)
              with Image.open(BytesIO(data)) as img:
                assert img.format=='JPEG'
                assert img.width<=700 and img.height<=500
              assert len(data)<160000
              credit=name[:-4]+'.txt'
              lines=z.read(credit).decode().splitlines()
              assert len(lines)>=3 and lines[1] and lines[2].startswith('https://commons.wikimedia.org/')
            print('VALIDATED',len(images),'SD card type photos')
          PY
      - name: Convert licensed JPEG pack to direct-render RGB565
        run: |
          python tools/build_aircraft_photo_rgb565.py \
            --input /tmp/SkyTracker-Photo-SD \
            --output /tmp/SkyTracker-RGB565-SD
      - name: Verify direct-render photo format and creator credits
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          path=Path('/tmp/SkyTracker-RGB565-SD/SkyTracker-Direct-RGB565-Aircraft-Photos.zip')
          with ZipFile(path) as z:
              assert z.testzip() is None
              photos=[n for n in z.namelist() if n.endswith('.rgb565') and not n.endswith('.full.rgb565')]
              assert len(photos)>=4, photos
              for photo in photos:
                  assert len(z.read(photo))==304*128*2
                  full=photo[:-7]+'.full.rgb565'
                  assert len(z.read(full))==320*166*2
                  credit=z.read(photo[:-7]+'.txt').decode('utf-8').splitlines()
                  assert len(credit)>=3 and credit[0] and credit[1]
                  assert credit[2].startswith('https://commons.wikimedia.org/')
              print('PASS:',len(photos),'little-endian RGB565 images with licence files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SkyTracker-Aircraft-Direct-RGB565-SD-Pack
          path: |
            /tmp/SkyTracker-RGB565-SD/SkyTracker-Direct-RGB565-Aircraft-Photos.zip
            /tmp/SkyTracker-Photo-SD/aircraft-photo-contact-sheet.jpg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: SkyTracker-Aircraft-Type-Photo-SD-Pack
          path: /tmp/SkyTracker-Photo-SD/SkyTracker-Representative-Plane-Photos-SD.zip
          if-no-files-found: error
          retention-days: 14
